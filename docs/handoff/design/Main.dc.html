<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NYC Algos – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Pixelify+Sans:wght@500;700&amp;family=Silkscreen&amp;display=swap">
<style>
body{margin:0;background:#eef2f5}
a{color:#1f5fa6}a:hover{color:#174a82}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
a.card{transition:transform .08s steps(2)}
a.card:hover{transform:translateY(-4px)}
a.card:focus-visible{outline:3px dashed #1f5fa6;outline-offset:6px}
</style>
</helmet>
<div style="min-height: 100vh; background: #eef2f5; background-image: linear-gradient(#e2e8ed 1px, transparent 1px), linear-gradient(90deg, #e2e8ed 1px, transparent 1px); background-size: 16px 16px; color: #1f2328; font-family: 'Inter', system-ui, sans-serif">
  <header style="background: #ffffff; border-bottom: 4px solid #1c1c1c">
    <div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #ffffff; background: #1c1c1c; padding: 6px 16px 6px 10px; box-sizing: border-box; font-family: 'Silkscreen', monospace; font-size: 20px; min-height: 44px">
        <svg width="35" height="15" viewBox="0 0 7 3" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="1" height="1" fill="#8a77c4"></rect><rect x="2" y="1" width="1" height="1" fill="#ffffff"></rect><rect x="3" y="1" width="1" height="1" fill="#8a77c4"></rect><rect x="0" y="2" width="2" height="1" fill="#ffffff"></rect><rect x="2" y="2" width="1" height="1" fill="#e9e3cc"></rect><rect x="3" y="2" width="1" height="1" fill="#ffffff"></rect><rect x="4" y="2" width="1" height="1" fill="#5fb39a"></rect><rect x="5" y="2" width="1" height="1" fill="#ffffff"></rect><rect x="6" y="2" width="1" height="1" fill="#f2c230"></rect></svg>
        NYC ALGOS
      </a>
      <nav aria-label="Main" style="display: flex; gap: 8px; flex-wrap: wrap; font-family: 'Silkscreen', monospace; font-size: 14px">
        <a href="#explainers" style="color: #1f2328; text-decoration: none; padding: 12px 12px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">EXPLAINERS</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 56px">
    <section style="display: flex; flex-direction: column; gap: 28px">
      <div style="background: #ffffff; padding: 8px; box-shadow: 0 -4px 0 0 #b8c2cc, 0 4px 0 0 #b8c2cc, -4px 0 0 0 #b8c2cc, 4px 0 0 0 #b8c2cc">
        <canvas class="px" ref="{{setHero}}" width="320" height="90" role="img" aria-label="Pixel-art skyline under a tiled blue sky with a murmuration of starlings" style="display: block; width: 100%; aspect-ratio: 320 / 90; background: #7db6e8"></canvas>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
        <h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: clamp(40px, 6vw, 72px); line-height: 1.02; letter-spacing: 0.5px">[HEADLINE]</h1>
        <div style="display: flex; gap: 12px; flex-wrap: wrap; padding-top: 8px">
          <a href="Pigeons.dc.html" style="font-family: 'Silkscreen', monospace; font-size: 16px; padding: 14px 20px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; background: {{accent}}; color: #14141f; text-decoration: none; box-shadow: 0 4px 0 #1c1c1c">[BUTTON] →</a>
        </div>
      </div>
    </section>

    <section id="explainers" style="display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 4px dotted #b8c2cc; padding-bottom: 12px">
        <h2 style="margin: 0; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 24px">[SECTION]</h2>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 24px">
        <sc-for list="{{cards}}" as="card" hint-placeholder-count="4">
          <sc-if value="{{card.live}}" hint-placeholder-val="{{ true }}">
            <a class="card" href="Pigeons.dc.html" style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 12px 18px; background: #ffffff; color: #1f2328; text-decoration: none; box-shadow: 0 -4px 0 0 #1c1c1c, 0 4px 0 0 #1c1c1c, -4px 0 0 0 #1c1c1c, 4px 0 0 0 #1c1c1c">
              <canvas class="px" ref="{{card.setRef}}" width="96" height="54" aria-hidden="true" style="display: block; width: 100%; aspect-ratio: 96 / 54; background: #dfe7ee"></canvas>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="font-family: 'Silkscreen', monospace; font-size: 13px; color: #1f5fa6">{{card.topic}}</span>
                <span style="font-family: 'Silkscreen', monospace; font-size: 12px; background: {{accent}}; color: #14141f; padding: 4px 8px">PLAY</span>
              </div>
              <h3 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 26px">{{card.title}}</h3>
            </a>
          </sc-if>
          <sc-if value="{{card.soon}}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 12px 18px; background: #f7f9fb; box-shadow: 0 -4px 0 0 #d3dae1, 0 4px 0 0 #d3dae1, -4px 0 0 0 #d3dae1, 4px 0 0 0 #d3dae1">
              <canvas class="px" ref="{{card.setRef}}" width="96" height="54" aria-hidden="true" style="display: block; width: 100%; aspect-ratio: 96 / 54; background: #dfe7ee; opacity: 0.75"></canvas>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="font-family: 'Silkscreen', monospace; font-size: 13px; color: #59626e">{{card.topic}}</span>
                <span style="font-family: 'Silkscreen', monospace; font-size: 12px; border: 2px solid #9aa5b1; color: #59626e; padding: 2px 6px">SOON</span>
              </div>
              <h3 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 26px; color: #2b3138">{{card.title}}</h3>
            </div>
          </sc-if>
        </sc-for>
      </div>
    </section>

  </main>

  <footer style="border-top: 4px solid #c9d1d9">
    <div style="max-width: 1120px; margin: 0 auto; padding: 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'Silkscreen', monospace; font-size: 12px; color: #59626e">
      <span>NYC ALGOS</span>
      <span>BY [YOUR NAME]</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f5c400","options":["#f5c400","#7db6e8","#e05a33","#ffffff"]},"$preview":{"width":1440,"height":1650}}'>
class Component extends DCLogic {
  thumbs = {};
  refFns = {};
  heroBirds = null;

  setHero = (el) => { this.hero = el; this.heroCtx = null; };

  refFor(id) {
    if (!this.refFns[id]) {
      this.refFns[id] = (el) => { this.thumbs[id] = el; if (el) this.drawThumb(id, el); };
    }
    return this.refFns[id];
  }

  componentDidMount() { this.alive = true; this.raf = requestAnimationFrame(this.loop); }
  componentWillUnmount() { this.alive = false; cancelAnimationFrame(this.raf); }

  rng(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

  sprites() {
    if (this._spr) return this._spr;
    var P = { k: '#1b1f2b', p: '#6a55a8', g: '#2f8a6e', w: '#f1ead2', y: '#f2c230' };
    var F = [
      ['..p....', '..kp...', 'kkwkgky', '.......'],
      ['.......', '.pk....', 'kkkwgky', '.......'],
      ['.......', '.......', 'kkwkgky', '..kp...']
    ];
    var out = [];
    for (var f = 0; f < 3; f++) {
      var c = document.createElement('canvas'); c.width = 7; c.height = 4;
      var x = c.getContext('2d');
      for (var r = 0; r < 4; r++) for (var col = 0; col < 7; col++) {
        var ch = F[f][r][col]; if (ch === '.') continue;
        x.fillStyle = P[ch]; x.fillRect(col, r, 1, 1);
      }
      out.push(c);
    }
    this._spr = out; return out;
  }

  mosaicSky(x, W, G, rnd) {
    var sky = ['#2f6fb8', '#3b80c6', '#4f93d4', '#69a8df', '#86bce8', '#a6d0f0', '#c4e1f6'];
    for (var y = 0; y < G; y++) {
      for (var xx = 0; xx < W; xx++) {
        var v = (y / G) * (sky.length - 1) + (rnd() - 0.5) * 1.1;
        var i = Math.max(0, Math.min(sky.length - 1, Math.round(v)));
        x.fillStyle = sky[i]; x.fillRect(xx, y, 1, 1);
      }
    }
  }

  cloud(x, cx, cy, s, rnd) {
    var C = [[0, 0, 1], [-1.15, 0.35, 0.72], [1.15, 0.4, 0.68], [0.55, -0.55, 0.72], [-0.55, -0.4, 0.62], [-1.9, 0.6, 0.45], [1.9, 0.65, 0.42]];
    var bottom = cy + s * 0.75;
    var inside = function (px, py) {
      if (py > bottom) return false;
      for (var k = 0; k < C.length; k++) { var dx = px - (cx + C[k][0] * s), dy = py - (cy + C[k][1] * s), r = C[k][2] * s; if (dx * dx + dy * dy <= r * r) return true; }
      return false;
    };
    for (var py = Math.floor(cy - s * 1.4); py <= bottom + 1; py++) for (var px = Math.floor(cx - s * 2.5); px <= cx + s * 2.5; px++) {
      if (inside(px, py)) {
        var shade = (py > cy + s * 0.35 && rnd() < 0.7) || (py > cy + s * 0.55);
        x.fillStyle = shade ? '#e4ebf2' : (rnd() < 0.06 ? '#f1f5f9' : '#ffffff');
        x.fillRect(px, py, 1, 1);
      } else if (rnd() < 0.45 && (inside(px + 1, py) || inside(px - 1, py) || inside(px, py + 1) || inside(px, py - 1))) {
        x.fillStyle = rnd() < 0.5 ? '#d6e8f6' : '#2a62a8';
        x.fillRect(px, py, 1, 1);
      }
    }
  }

  heroScene() {
    var W = 320, H = 90, G = 80;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'); var rnd = this.rng(11), y, xx;
    this.mosaicSky(x, W, G, rnd);
    this.cloud(x, 70, 26, 12, rnd);
    this.cloud(x, 230, 18, 9, rnd);
    var layers = [['#a9b4bf', 18, 40, '#d7e1ea'], ['#7d8894', 8, 22, '#c9d6e2']];
    for (var L = 0; L < 2; L++) {
      xx = 0;
      while (xx < W) {
        var bw = 6 + Math.floor(rnd() * 12), bh = layers[L][1] + Math.floor(rnd() * layers[L][2]), top = 74 - bh;
        x.fillStyle = layers[L][0]; x.fillRect(xx, top, bw, 74 - top);
        x.fillStyle = L ? '#6c7783' : '#97a3ae'; x.fillRect(xx + bw - 2, top, 2, 74 - top);
        if (rnd() < 0.15) { x.fillStyle = layers[L][0]; x.fillRect(xx + Math.floor(bw / 2), top - 5, 1, 5); }
        x.fillStyle = layers[L][3];
        for (var wy = top + 3; wy < 70; wy += 4) for (var wx = xx + 2; wx < xx + bw - 2; wx += 3) if (rnd() < 0.4) x.fillRect(wx, wy, 1, 1);
        xx += bw + (rnd() < 0.3 ? 1 : 0);
      }
    }
    for (var tx = -4; tx < W + 4; tx += 7) {
      var cx = tx + Math.floor(rnd() * 4), cy = 72 + Math.floor(rnd() * 4), r = 5 + Math.floor(rnd() * 3);
      for (var dy = -r; dy <= r; dy++) for (var dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r) {
        x.fillStyle = (dx + dy < -r * 0.5) ? '#7fbf5a' : (rnd() < 0.2 ? '#5d9e48' : '#4b8a3e'); x.fillRect(cx + dx, cy + dy, 1, 1);
      }
    }
    for (y = G; y < H; y++) for (xx = 0; xx < W; xx++) { x.fillStyle = rnd() < 0.3 ? '#73b356' : '#82c063'; x.fillRect(xx, y, 1, 1); }
    for (y = G + 4; y < G + 7; y++) for (xx = 0; xx < W; xx++) { x.fillStyle = rnd() < 0.25 ? '#c3b9a5' : '#d9d1c0'; x.fillRect(xx, y, 1, 1); }
    x.fillStyle = '#2f353c'; x.fillRect(60, G - 12, 1, 12); x.fillRect(250, G - 12, 1, 12);
    x.fillStyle = '#e9eef2'; x.fillRect(59, G - 13, 3, 2); x.fillRect(249, G - 13, 3, 2);
    return c;
  }

  loop = (t) => {
    if (!this.alive) return;
    this.raf = requestAnimationFrame(this.loop);
    var c = this.hero; if (!c) return;
    if (!this.heroCtx || this.heroCtx.canvas !== c) {
      c.width = 320; c.height = 90; this.heroCtx = c.getContext('2d'); this.heroCtx.imageSmoothingEnabled = false;
      this.heroBg = this.heroScene();
      var rnd = this.rng(5); this.heroBirds = [];
      for (var i = 0; i < 40; i++) { var ang = rnd() * Math.PI * 2, rad = Math.sqrt(rnd()); this.heroBirds.push({ ox: Math.cos(ang) * rad * 30, oy: Math.sin(ang) * rad * 12, ph: rnd() * 4, b: rnd() * 6, r: 2 + rnd() * 4 }); }
      this.heroX = 40;
    }
    var ctx = this.heroCtx, spr = this.sprites();
    ctx.drawImage(this.heroBg, 0, 0);
    var tt = (t || 0) / 1000;
    this.heroX += 0.35; if (this.heroX > 370) this.heroX = -50;
    var mx = this.heroX, my = 30 + Math.sin(tt * 0.6) * 6, stretch = 1 + Math.sin(tt * 0.9) * 0.35;
    for (var k = 0; k < this.heroBirds.length; k++) {
      var b = this.heroBirds[k];
      b.ph += 0.22;
      var fr = [0, 1, 2, 1][Math.floor(b.ph) % 4];
      var px = mx + b.ox * stretch + Math.cos(tt * 1.3 + b.b) * b.r;
      var py = my + b.oy / stretch + Math.sin(tt * 1.7 + b.b) * b.r * 0.6 + Math.sin(tt * 1.1 + b.ox * 0.08) * 4;
      ctx.drawImage(spr[fr], Math.round(px) - 3, Math.round(py) - 2);
    }
  };

  drawThumb(id, c) {
    c.width = 96; c.height = 54;
    var x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    var rnd = this.rng(id.length * 97 + 3), i, j, y, xx;
    var noise = function (x0, y0, w, h, a, b, p) { for (var yy = y0; yy < y0 + h; yy++) for (var q = x0; q < x0 + w; q++) { x.fillStyle = rnd() < p ? b : a; x.fillRect(q, yy, 1, 1); } };
    if (id === 'pigeons') {
      this.mosaicSky(x, 96, 46, rnd);
      this.cloud(x, 70, 14, 6, rnd);
      x.fillStyle = '#8b96a1';
      for (i = 0; i < 96; i += 5) { var h = 4 + Math.floor(rnd() * 12); x.fillRect(i, 46 - h, 5, h); }
      noise(0, 46, 96, 8, '#82c063', '#73b356', 0.3);
      for (j = 22; j < 46; j++) for (i = 66; i < 88; i++) {
        var hole = i >= 72 && i < 82 && (j >= 34 || (i - 76.5) * (i - 76.5) + (j - 34) * (j - 34) <= 25);
        if (!hole) { x.fillStyle = (i === 66 || j === 26) ? '#c9c3b3' : '#e9e4d6'; x.fillRect(i, j, 1, 1); }
      }
      x.fillStyle = '#1b1f2b';
      for (i = 0; i < 260; i++) {
        var u = rnd() * Math.PI * 2, rr = Math.sqrt(rnd());
        var t2 = rnd(), bx = 8 + t2 * 52, by = 20 + Math.sin(t2 * 5.5) * 7, ww = 4 + Math.sin(t2 * 3.1) * 5;
        x.fillRect(Math.round(bx + Math.cos(u) * rr * 3), Math.round(by + Math.sin(u) * rr * ww), 1, 1);
      }
    } else if (id === 'subway') {
      noise(0, 0, 96, 54, '#f4f6f8', '#eaeef2', 0.25);
      x.fillStyle = '#dde3e9';
      for (i = 0; i < 96; i += 8) x.fillRect(i, 0, 1, 54);
      for (j = 0; j < 54; j += 8) x.fillRect(0, j, 96, 1);
      var lines = [
        ['#e05a33', [[6, 8], [30, 8], [44, 22], [44, 46]]],
        ['#2e9e6b', [[6, 30], [28, 30], [44, 22], [70, 22], [90, 42]]],
        ['#1f5fa6', [[60, 6], [60, 22], [60, 38], [86, 38]]]
      ];
      var seg = function (a, b, col) {
        var n = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
        x.fillStyle = col;
        for (var s = 0; s <= n; s++) { var px = Math.round(a[0] + (b[0] - a[0]) * s / n), py = Math.round(a[1] + (b[1] - a[1]) * s / n); x.fillRect(px, py, 2, 2); }
      };
      for (i = 0; i < lines.length; i++) { var L = lines[i][1]; for (j = 0; j < L.length - 1; j++) seg(L[j], L[j + 1], lines[i][0]); }
      var stations = [[6, 8], [30, 8], [44, 22], [44, 46], [6, 30], [28, 30], [70, 22], [90, 42], [60, 6], [60, 38], [86, 38], [60, 22]];
      for (i = 0; i < stations.length; i++) { x.fillStyle = '#1c1c1c'; x.fillRect(stations[i][0] - 1, stations[i][1] - 1, 4, 4); x.fillStyle = '#ffffff'; x.fillRect(stations[i][0], stations[i][1], 2, 2); }
    } else if (id === 'braess') {
      noise(0, 0, 96, 54, '#82c063', '#73b356', 0.3);
      x.fillStyle = '#8a929b';
      x.fillRect(0, 10, 96, 5); x.fillRect(0, 40, 96, 5); x.fillRect(12, 0, 5, 54); x.fillRect(78, 0, 5, 54);
      x.fillStyle = '#e9eef2';
      for (i = 0; i < 96; i += 4) { x.fillRect(i, 12, 2, 1); x.fillRect(i, 42, 2, 1); }
      x.fillStyle = '#f5c400';
      for (i = 0; i < 26; i += 1) { if (i % 3 === 2) continue; x.fillRect(Math.round(17 + i * 2.35), Math.round(15 + i * 0.97), 2, 2); }
      var cars = ['#f5c400', '#e05a33', '#ffffff', '#1f5fa6'];
      for (i = 0; i < 10; i++) { x.fillStyle = cars[i % 4]; x.fillRect(4 + i * 9, i % 2 ? 11 : 13, 3, 2); }
      for (i = 0; i < 5; i++) { x.fillStyle = cars[(i + 1) % 4]; x.fillRect(13 + (i % 2) * 2, 18 + i * 6, 2, 3); }
      for (i = 0; i < 3; i++) { x.fillStyle = cars[(i + 2) % 4]; x.fillRect(30 + i * 20, 41, 3, 2); }
    } else {
      noise(0, 0, 96, 54, '#c9d1d9', '#bcc5ce', 0.3);
      var blues = ['#2f6fb8', '#3b80c6', '#4f93d4', '#69a8df'];
      for (y = 0; y < 54; y++) for (xx = 34; xx < 60; xx++) { x.fillStyle = blues[Math.floor(rnd() * blues.length)]; x.fillRect(xx, y, 1, 1); }
      x.fillStyle = '#8b96a1';
      for (i = 0; i < 34; i += 4) { var bh2 = 6 + Math.floor(rnd() * 14); x.fillRect(i, 54 - bh2, 3, bh2); }
      for (i = 62; i < 96; i += 4) { var bh3 = 4 + Math.floor(rnd() * 10); x.fillRect(i, 54 - bh3, 3, bh3); }
      var ys = [8, 20, 32, 44];
      for (i = 0; i < ys.length; i++) {
        x.fillStyle = '#4b535c'; x.fillRect(30, ys[i], 34, 2);
        x.fillStyle = '#e9e4d6'; x.fillRect(39, ys[i] - 4, 2, 6); x.fillRect(53, ys[i] - 4, 2, 6);
      }
      x.fillStyle = '#f5c400'; x.fillRect(31, 7, 2, 2); x.fillRect(61, 21, 2, 2); x.fillRect(31, 31, 2, 2);
    }
  }

  renderVals() {
    var base = [
      { id: 'pigeons', num: '01', topic: 'STARLINGS', title: '[TITLE]', live: true },
      { id: 'subway', num: '02', topic: 'A* SEARCH', title: '[TITLE]', live: false },
      { id: 'braess', num: '03', topic: 'BRAESS’S PARADOX', title: '[TITLE]', live: false },
      { id: 'bridges', num: '04', topic: 'EULER PATHS', title: '[TITLE]', live: false }
    ];
    var self = this;
    return {
      accent: this.props.accent ?? '#f5c400',
      setHero: this.setHero,
      cards: base.map(function (c) { return Object.assign({}, c, { soon: !c.live, setRef: self.refFor(c.id) }); })
    };
  }
}
</script>
</body>
</html>
